[package]
name = "httpdispatcher"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A HTTP server that processes and forwards requests using VRL and custom processors"

[dependencies]
tokio = { version = "1.43.0", features = ["full"] }
axum = { version = "0.8.1", features = ["json", "macros"] }
hyper = { version = "1.6.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["limit","trace"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
toml = "0.8"
async-trait = "0.1"
uuid = { version = "1.7", features = ["v4"] }
chrono = "0.4"
log = "0.4"
clap = { version = "4.5", features = ["derive"] }
handlebars = "5.1"
vrl = "0.22.0"
reqwest = { version = "0.12.12", features = ["json", "gzip", "native-tls"] }
regex = "1.11.1"
serde_urlencoded = "0.7"
tracing = "0.1.41"
nanoid = "0.4.0"
tracing-subscriber = {version="0.3.19",features=["env-filter", "json"]}
anyhow = "1.0.97"
